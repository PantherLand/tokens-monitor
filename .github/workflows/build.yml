name: Build and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
    
    - name: Build
      run: |
        swift build -c release
    
    - name: Run tests
      run: |
        swift test
    
    - name: Archive app (for tags only)
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        # 这里需要实际的 Xcode 项目才能 archive
        # 使用 swift build 的输出创建简单的分发包
        mkdir -p dist
        cp -r .build/release/OpenRouterMonitor dist/
        
    - name: Create DMG (for tags only)
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        # 创建 DMG 的脚本（需要实际的 .app bundle）
        echo "Creating DMG..."
        # hdiutil create -volname "OpenRouter Monitor" -srcfolder dist -ov -format UDZO OpenRouterMonitor.dmg
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          OpenRouterMonitor.dmg
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
